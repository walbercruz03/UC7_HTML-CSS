<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Walber - Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <header>
            <div class="profile-badge">W</div>
            <h1>Buscador Walber</h1>
            <p class="subtitle">Encontre os melhores trailers e filmes</p>
        </header>
        
        <div class="search-box">
            <input type="text" id="userInput" placeholder="Qual filme deseja encontrar?">
            <button id="sendBtn">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <div id="loading" class="hidden">
            <div class="pulse-loader"></div>
        </div>
        
        <div id="responseArea" class="movie-grid"></div>
    </div>

    <button class="fab" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script src="script.js"></script>
</body>
</html>
