<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão Escolar</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; min-height: 100vh; background-color: #f4f6f9; }
        
        /* --- MENU LATERAL (SIDEBAR) --- */
        .sidebar { width: 260px; background-color: #2c3e50; color: white; display: flex; flex-direction: column; }
        .sidebar h2 { padding: 20px; text-align: center; background-color: #1a252f; border-bottom: 2px solid #e74c3c; }
        .menu { list-style: none; flex: 1; margin-top: 10px; }
        .menu li { border-bottom: 1px solid #34495e; }
        .menu a, .menu button { 
            width: 100%; display: block; padding: 15px 20px; color: #ecf0f1; 
            text-decoration: none; border: none; background: none; 
            text-align: left; cursor: pointer; font-size: 16px; transition: 0.3s; 
        }
        .menu a:hover, .menu button:hover { background-color: #e74c3c; padding-left: 25px; }

        /* --- ÁREA DE CONTEÚDO PRINCIPAL --- */
        .content { flex: 1; padding: 30px; display: flex; flex-direction: column; }
        .header { 
            background: white; padding: 20px; border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; 
        }
        .header h1 { color: #34495e; }
        
        /* --- ÁREA DINÂMICA ONDE OS DADOS APARECEM --- */
        #view-area { 
            background: white; padding: 30px; border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex: 1; 
        }
        #view-area h2 { color: #2c3e50; margin-bottom: 15px; }
        pre { 
            background: #2d2d2d; color: #a6e22e; padding: 15px; 
            border-radius: 5px; overflow-x: auto; font-size: 15px; 
        }

        /* --- ESTILOS DE TABELAS --- */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; font-size: 15px; color: #2c3e50; }
        th { background-color: #34495e; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }

        /* --- ESTILOS DOS FORMULÁRIOS --- */
        form { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin-top: 20px; }
        form p { display: flex; flex-direction: column; gap: 5px; font-weight: bold; color: #34495e; font-size: 14px; }
        form input, form select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; outline: none; background: white; }
        form input:focus, form select:focus { border-color: #e74c3c; }
        form button { padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        form button:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <nav class="sidebar">
        <h2>Gestão Escolar</h2>
        <ul class="menu">
            <li><button onclick="mostrarInicio()">🏠 Início</button></li>
            <li><button onclick="mostrarFormularioAluno()">📝 Cadastrar Aluno</button></li>
            <li><button onclick="mostrarFormularioCurso()">📝 Cadastrar Curso</button></li>
            <li><button onclick="mostrarFormularioMatricula()">📝 Fazer Matrícula</button></li>
            <li><button onclick="carregarDados('alunos')">🎓 Ver Alunos</button></li>
            <li><button onclick="carregarDados('cursos')">📚 Ver Cursos</button></li>
            <li><button onclick="carregarDados('matriculas')">📋 Ver Matrículas</button></li>
        </ul>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="content">
        <header class="header">
            <h1>Painel de Controle</h1>
        </header>

        <div id="view-area">
            <h2>Bem-vindo ao Sistema!</h2>
            <p>Use o menu lateral esquerdo para navegar.</p>
            <p>A interatividade aqui permite que você veja os dados em tempo real buscando direto da sua API do Express sem sair da página!</p>
        </div>
    </main>

    <!-- Script de Interatividade -->
    <script>
        async function mostrarInicio() {
            const view = document.getElementById('view-area');
            view.innerHTML = `<h2>Carregando Dashboard... ⏳</h2>`;
            
            try {
                // Faz a requisição simultânea para todas as rotas
                const [resAlunos, resCursos, resMatriculas] = await Promise.all([ 
                    fetch('/alunos'), fetch('/cursos'), fetch('/matriculas') 
                ]);
                
                const alunos = await resAlunos.json();
                const cursos = await resCursos.json();
                const matriculas = await resMatriculas.json();

                view.innerHTML = `
                    <h2>Dashboard</h2>
                    <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; margin-top: 15px;">
                        <div style="flex: 1; background: #3498db; color: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                            <h3>Total de Alunos</h3>
                            <p style="font-size: 28px; font-weight: bold; margin-top: 10px;">${alunos.length}</p>
                        </div>
                        <div style="flex: 1; background: #2ecc71; color: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                            <h3>Total de Cursos</h3>
                            <p style="font-size: 28px; font-weight: bold; margin-top: 10px;">${cursos.length}</p>
                        </div>
                        <div style="flex: 1; background: #e74c3c; color: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                            <h3>Total de Matrículas</h3>
                            <p style="font-size: 28px; font-weight: bold; margin-top: 10px;">${matriculas.length}</p>
                        </div>
                    </div>
                    
                    <div style="width: 100%; max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                        <canvas id="meuGrafico"></canvas>
                    </div>
                `;

                // Criação do gráfico dinâmico usando Chart.js
                const ctx = document.getElementById('meuGrafico').getContext('2d');
                new Chart(ctx, {
                    type: 'bar', // Tipo de gráfico: barras
                    data: {
                        labels: ['Alunos', 'Cursos', 'Matrículas'],
                        datasets: [{
                            label: 'Quantidade Cadastrada',
                            data: [alunos.length, cursos.length, matriculas.length],
                            backgroundColor: ['rgba(52, 152, 219, 0.7)', 'rgba(46, 204, 113, 0.7)', 'rgba(231, 76, 60, 0.7)'],
                            borderColor: ['#2980b9', '#27ae60', '#c0392b'],
                            borderWidth: 1
                        }]
                    },
                    options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
                });
            } catch (error) {
                view.innerHTML = `<h2 style="color:red;">Erro ao carregar o Dashboard</h2><p>${error.message}</p>`;
            }
        }

        // --- FUNÇÕES DE EXIBIÇÃO DE FORMULÁRIOS ---
        function mostrarFormularioAluno() {
            document.getElementById('view-area').innerHTML = `
                <h2>Cadastrar Novo Aluno</h2>
                <form onsubmit="enviarFormulario(event, 'alunos')">
                    <p>Nome do Aluno: <input type="text" name="nome" required placeholder="Ex: João da Silva"></p>
                    <p>Email: <input type="email" name="email" required placeholder="Ex: joao@email.com"></p>
                    <button type="submit">Salvar Aluno</button>
                </form>
            `;
        }

        function mostrarFormularioCurso() {
            document.getElementById('view-area').innerHTML = `
                <h2>Cadastrar Novo Curso</h2>
                <form onsubmit="enviarFormulario(event, 'cursos')">
                    <p>Nome do Curso: <input type="text" name="nome" required placeholder="Ex: Programação Web"></p>
                    <p>Carga Horária (horas): <input type="number" name="ch" required placeholder="Ex: 40"></p>
                    <button type="submit">Salvar Curso</button>
                </form>
            `;
        }

        async function mostrarFormularioMatricula() {
            const view = document.getElementById('view-area');
            view.innerHTML = `<h2>Carregando... ⏳</h2>`;
            
            try {
                // Busca os alunos e cursos já cadastrados na API
                const [resAlunos, resCursos] = await Promise.all([ fetch('/alunos'), fetch('/cursos') ]);
                const alunos = await resAlunos.json();
                const cursos = await resCursos.json();

                // Se não houver aluno ou curso, avisa o usuário que é preciso cadastrar antes
                if (alunos.length === 0 || cursos.length === 0) {
                    view.innerHTML = `
                        <h2>Fazer Matrícula</h2>
                        <p style="color: #e74c3c; font-weight: bold; margin-top: 15px;">⚠️ Atenção: É necessário cadastrar pelo menos um aluno e um curso antes de realizar uma matrícula.</p>
                    `;
                    return;
                }

                // Cria as opções (options) com base no JSON recebido
                let opcoesAlunos = alunos.map(a => `<option value="${a.nome}">${a.nome}</option>`).join('');
                let opcoesCursos = cursos.map(c => `<option value="${c.nome}">${c.nome}</option>`).join('');

                view.innerHTML = `
                    <h2>Fazer Matrícula</h2>
                    <form onsubmit="enviarFormulario(event, 'matriculas')">
                        <p>Selecione o Aluno: <select name="aluno" required><option value="" disabled selected>Escolha um aluno...</option>${opcoesAlunos}</select></p>
                        <p>Selecione o Curso: <select name="curso" required><option value="" disabled selected>Escolha um curso...</option>${opcoesCursos}</select></p>
                        <button type="submit">Efetivar Matrícula</button>
                    </form>
                `;
            } catch (error) {
                view.innerHTML = `<h2 style="color:red;">Erro ao carregar os dados</h2><p>${error.message}</p>`;
            }
        }

        // --- FUNÇÃO QUE ENVIA OS DADOS PARA A API (POST) ---
        async function enviarFormulario(event, rota) {
            event.preventDefault(); // Impede a página de recarregar
            
            const form = event.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries()); // Transforma os dados em JSON

            try {
                const response = await fetch(`/${rota}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if(response.ok) {
                    alert(result.mensagem || 'Cadastro realizado com sucesso!');
                    carregarDados(rota); // Redireciona automaticamente para a lista
                } else {
                    alert('Erro: ' + (result.erro || 'Falha no cadastro!'));
                }
            } catch (error) {
                alert('Erro de conexão: ' + error.message);
            }
        }

        async function carregarDados(rota) {
            const view = document.getElementById('view-area');
            view.innerHTML = `<h2>Carregando ${rota}... ⏳</h2>`;
            
            try {
                const response = await fetch(`/${rota}`);
                const data = await response.json();
                
                let titulo = rota.charAt(0).toUpperCase() + rota.slice(1);
                let html = `<h2>Lista de ${titulo}</h2>`;
                
                if (data.length === 0) {
                    html += `<p>Nenhum registro encontrado ainda.</p>`;
                } else {
                    // Cria uma tabela HTML baseada nas propriedades (chaves) do objeto JSON
                    html += `<table>`;
                    let colunas = Object.keys(data[0]);
                    html += `<thead><tr>`;
                    colunas.forEach(col => { html += `<th>${col.toUpperCase()}</th>`; });
                    html += `</tr></thead><tbody>`;
                    
                    data.forEach(item => {
                        html += `<tr>`;
                        colunas.forEach(col => { html += `<td>${item[col]}</td>`; });
                        html += `</tr>`;
                    });
                    html += `</tbody></table>`;
                }
                
                view.innerHTML = html;
            } catch (error) {
                view.innerHTML = `<h2 style="color:red;">Erro ao buscar dados</h2><p>${error.message}</p>`;
            }
        }

        // Exibe o dashboard automaticamente quando a página carregar
        window.onload = mostrarInicio;
    </script>
</body>
</html>
