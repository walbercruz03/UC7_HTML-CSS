<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<div class="feedback-container" style="
    background-color: #f0f7ff; 
    padding: 40px; 
    margin-top: 20px; 
    border-radius: 15px; 
    border: 2px solid #add8e6;
    font-family: sans-serif;
    display: flex;
    flex-direction: column; /* força os itens a ficarem em coluna */
    gap: 30px;">

    <h1>Bem-vindo à Pagina de Matrícula</h1>

    <div style="flex: 1; min-width: 320px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        <h3 style="color: #0056b3; margin-top: 0; margin-bottom: 20px; font-size: 24px; border-bottom: 2px solid #f0f7ff; padding-bottom: 10px;">Dados necessários</h3>

        <form style="display: flex; flex-direction: column; gap: 12px;">
            <input type="text" placeholder="Seu Nome" required style="padding: 12px; border: 1px solid #add8e6; border-radius: 6px; outline-color: #007bff;">
            <input type="email" placeholder="Seu E-mail" required style="padding: 12px; border: 1px solid #add8e6; border-radius: 6px; outline-color: #007bff;">
            <input type="tel" placeholder="Telefone" style="padding: 12px; border: 1px solid #add8e6; border-radius: 6px; outline-color: #007bff;">
            <input type="text" placeholder="Endereço" required style="padding: 12px; border: 1px solid #add8e6; border-radius: 6px; outline-color: #007bff;">
            <select style="padding: 12px; border: 1px solid #add8e6; border-radius: 6px; background: white; color: #555;">
                <option disabled selected>Escolha seu curso</option>
                <option>Full Stack Developer</option>
                <option>Front-End Pro</option>
                <option>UX/UI Design</option>
            </select>

            <textarea placeholder="Sua mensagem..." rows="4" style="padding: 12px; border: 1px solid #add8e6; border-radius: 6px; outline-color: #007bff; resize: none;"></textarea>

            <button type="submit" style="background-color: #0056b3; color: white; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.3s;">
               EFETUAR MATRÍCULA
            </button>
        </form>
    </div>
    </div>

</body>
</html>
